<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>صفحة نوف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  /*
    Design language: a real product chat UI (WhatsApp/Telegram-class),
    not an "AI generated" gradient/glass look.
    Flat surfaces, one brand color, hairline borders, real message
    bubbles with tails, hashed avatar colors per user.
  */
  :root{
    --brand:#0f6657;        /* deep teal - the one accent color, used sparingly */
    --brand-dark:#0b4d42;
    --header:#075e54;       /* header bar */
    --panel:#f7f8fa;        /* dock / bars */
    --chat-bg:#eef1f4;      /* message list backdrop */
    --bubble-mine:#d9f2df;
    --bubble-mine-border:#c3e9cc;
    --bubble-other:#ffffff;
    --bubble-other-border:#e3e6ea;
    --ink:#111b21;
    --ink-dim:#667781;
    --ink-faint:#98a2ad;
    --line:#e5e8eb;
    --danger:#d92d20;
    --warn:#b54708;
    --online:#12b76a;
    --idle:#f79009;
    --offline:#98a2ad;
    --radius-sm:8px; --radius-md:12px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Tajawal',sans-serif; background:var(--chat-bg); color:var(--ink);
    height:100dvh; overflow:hidden; display:flex; flex-direction:column;
    -webkit-tap-highlight-color:transparent; user-select:none;
  }
  ::-webkit-scrollbar{width:6px;}
  ::-webkit-scrollbar-thumb{background:#c7ccd1; border-radius:3px;}

  /* ================= Gate (login) ================= */
  #gate{
    position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center;
    background:var(--chat-bg);
  }
  #gateTop{
    position:absolute; top:0; left:0; right:0; height:34vh; min-height:210px;
    background:var(--header);
  }
  #gateCard{
    position:relative; width:90%; max-width:380px; background:#fff; border-radius:var(--radius-md);
    padding:2rem 1.6rem 1.7rem; box-shadow:0 2px 10px rgba(0,0,0,.12), 0 12px 28px rgba(0,0,0,.08);
    text-align:center; z-index:2;
  }
  #gateCard .mark{
    width:64px; height:64px; margin:-3.6rem auto 1rem; border-radius:50%; background:var(--brand);
    display:flex; align-items:center; justify-content:center; font-size:28px; color:#fff;
    box-shadow:0 4px 14px rgba(15,102,87,.35); border:4px solid #fff;
  }
  #gateCard h1{font-size:1.3rem; font-weight:800; margin-bottom:.25rem; color:var(--ink);}
  #gateCard p.sub{color:var(--ink-dim); font-size:.82rem; margin-bottom:1.3rem;}
  #gateStatus{
    font-size:.78rem; color:var(--ink-dim); min-height:16px; margin-bottom:1rem;
    display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .dot-pulse{width:6px; height:6px; border-radius:50%; background:var(--brand); animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{opacity:.35;}50%{opacity:1;}}
  #nameField{
    width:100%; padding:12px 16px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:#fff; color:var(--ink); font-family:inherit; font-size:16px; text-align:center;
    margin-bottom:.8rem; transition:.15s;
  }
  #nameField:focus{outline:none; border-color:var(--brand); box-shadow:0 0 0 3px rgba(15,102,87,.12);}
  #nameField:disabled{background:#f2f3f4; color:var(--ink-faint);}
  #enterBtn{
    width:100%; padding:12px; border:none; border-radius:var(--radius-sm); cursor:pointer; font-family:inherit;
    font-weight:700; font-size:15px; color:#fff; background:var(--brand); transition:.15s;
  }
  #enterBtn:hover:not(:disabled){background:var(--brand-dark);}
  #enterBtn:disabled{background:#c9d1cf; cursor:not-allowed;}
  #gateHint{color:var(--danger); font-size:.76rem; min-height:16px; margin-top:.6rem;}

  /* ================= App shell ================= */
  #app{display:flex; flex-direction:column; height:100dvh; opacity:0; transition:opacity .2s ease;}
  #app.on{opacity:1;}

  #header{
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--header);
    color:#fff; flex-shrink:0; box-shadow:0 1px 3px rgba(0,0,0,.15); z-index:5;
  }
  #header .brandmark{
    width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.16);
    display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0;
  }
  #header .titles{display:flex; flex-direction:column; line-height:1.25; min-width:0;}
  #header .titles b{font-size:.98rem; font-weight:700;}
  #header .titles small{font-size:.72rem; color:rgba(255,255,255,.75); display:flex; align-items:center; gap:5px;}
  #headerOnlineDot{width:7px; height:7px; border-radius:50%; background:var(--online);}
  #headerActions{display:flex; gap:2px; margin-right:auto; flex-shrink:0;}
  .hdr-btn{
    background:none; border:none; color:#fff; cursor:pointer; padding:9px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  .hdr-btn:hover{background:rgba(255,255,255,.14);}
  .hdr-btn svg{width:20px; height:20px; fill:currentColor;}
  #bringBackTop{display:none;}

  #feed{
    flex:1; overflow-y:auto; padding:14px 12px 6px; display:flex; flex-direction:column; gap:2px;
    overscroll-behavior:contain; scroll-behavior:smooth;
  }
  .row{display:flex; gap:8px; margin:3px 0; max-width:100%;}
  .row.mine{justify-content:flex-end;}
  .row.theirs{justify-content:flex-start;}

  .avatar{
    width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:.78rem; font-weight:700; margin-top:2px;
  }
  .row.mine .avatar{order:2;}

  .stack{display:flex; flex-direction:column; max-width:76%;}
  .row.mine .stack{align-items:flex-end;}
  .row.theirs .stack{align-items:flex-start;}

  .who{font-size:.72rem; font-weight:700; color:var(--brand); margin:0 8px 2px;}

  .bub{
    position:relative; padding:7px 11px 6px; border-radius:var(--radius-md); font-size:.93rem; line-height:1.5;
    word-break:break-word; box-shadow:0 1px 1px rgba(0,0,0,.04);
  }
  .row.mine .bub{background:var(--bubble-mine); border:1px solid var(--bubble-mine-border); border-top-left-radius:3px;}
  .row.theirs .bub{background:var(--bubble-other); border:1px solid var(--bubble-other-border); border-top-right-radius:3px;}

  .bub-meta{display:flex; align-items:center; gap:5px; justify-content:flex-end; margin-top:2px;}
  .bub-time{font-size:.65rem; color:var(--ink-faint);}
  .bub-del{
    background:none; border:none; color:var(--ink-faint); cursor:pointer; opacity:0; transition:.15s;
    border-radius:50%; padding:2px; display:flex;
  }
  .row.mine:hover .bub-del{opacity:.65;}
  .bub-del:hover{opacity:1 !important; color:var(--danger);}
  .bub-del svg{width:12px; height:12px;}

  .sysnote{
    align-self:center; font-size:.72rem; color:var(--ink-dim); background:#dfe6e3;
    padding:4px 12px; border-radius:99px; margin:8px auto;
  }

  #typeline{
    padding:2px 16px; font-size:.74rem; color:var(--ink-dim); min-height:20px; opacity:0; transition:.15s;
    flex-shrink:0; display:flex; align-items:center; gap:6px;
  }
  #typeline.on{opacity:1;}
  .tdots{display:inline-flex; gap:3px;}
  .tdots i{width:4px; height:4px; border-radius:50%; background:var(--brand); display:block; animation:tb 1.3s infinite;}
  .tdots i:nth-child(2){animation-delay:.15s;} .tdots i:nth-child(3){animation-delay:.3s;}
  @keyframes tb{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  #dock{
    display:flex; align-items:center; gap:8px; padding:8px 10px; background:var(--panel);
    border-top:1px solid var(--line); flex-shrink:0;
  }
  #textField{
    flex:1; font-size:16px; padding:11px 16px; border-radius:22px; border:1px solid var(--line);
    background:#fff; color:var(--ink); font-family:inherit;
  }
  #textField:focus{outline:none; border-color:var(--brand);}
  #textField:disabled{background:#eee;}
  #shootBtn{
    width:42px; height:42px; border:none; border-radius:50%; cursor:pointer; flex-shrink:0;
    color:#fff; background:var(--brand); display:flex; align-items:center; justify-content:center; transition:.15s;
  }
  #shootBtn:disabled{background:#c9d1cf; cursor:not-allowed;}
  #shootBtn:hover:not(:disabled){background:var(--brand-dark);}
  #shootBtn svg{width:19px; height:19px; fill:currentColor; transform:scaleX(-1);}

  /* ================= Modal ================= */
  .veil{
    position:fixed; inset:0; background:rgba(17,27,33,.5); z-index:900;
    display:flex; align-items:center; justify-content:center;
  }
  .sheet{
    width:88%; max-width:360px; background:#fff; border-radius:var(--radius-md);
    padding:1.3rem; box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .sheet h3{font-size:1rem; margin-bottom:1rem; text-align:center; color:var(--ink); font-weight:700;}
  .sheet input{
    width:100%; padding:11px 14px; border-radius:var(--radius-sm); border:1px solid var(--line);
    background:#fff; color:var(--ink); font-family:inherit; text-align:center; margin-bottom:10px;
  }
  .sheet input:focus{outline:none; border-color:var(--brand);}
  .sheet small{display:block; text-align:center; color:var(--ink-faint); margin-bottom:14px; font-size:.7rem;}
  .btn-full{
    width:100%; padding:11px; border:none; border-radius:var(--radius-sm); cursor:pointer; font-family:inherit;
    font-weight:700; color:#fff; background:var(--brand); transition:.15s;
    display:flex; align-items:center; justify-content:center; gap:8px; font-size:.92rem;
  }
  .btn-full:hover{background:var(--brand-dark);}
  .btn-full:disabled{opacity:.6; cursor:not-allowed;}
  .btn-full.ghost{background:#eef0f1; color:var(--ink);}
  .btn-full.danger{background:var(--danger);}
  .row2{display:flex; gap:10px;}
  .spin{
    width:13px; height:13px; border-radius:50%; border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff; animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  #rosterList{max-height:280px; overflow-y:auto; margin:-4px;}
  .roster-row{display:flex; align-items:center; gap:10px; padding:9px 4px; border-bottom:1px solid var(--line); font-size:.88rem;}
  .roster-row:last-child{border-bottom:none;}
  .beacon{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .beacon.up{background:var(--online);} .beacon.idle{background:var(--idle);} .beacon.down{background:var(--offline);}
  .roster-status{margin-right:auto; font-size:.7rem; color:var(--ink-faint);}
  .roster-empty{text-align:center; color:var(--ink-faint); font-size:.85rem; padding:14px 0;}

  /* ================= Video widget ================= */
  #screen{
    position:fixed; top:64px; left:16px; width:340px; min-width:260px; max-width:92vw;
    background:#000; border-radius:var(--radius-md); overflow:hidden auto; z-index:850; display:none;
    flex-direction:column; box-shadow:0 12px 30px rgba(0,0,0,.35); resize:both; touch-action:none;
  }
  #screen.small{height:42px !important; min-height:42px !important;}
  .screen-head{
    background:var(--header); color:#fff; padding:8px 10px; display:flex; align-items:center;
    justify-content:space-between; gap:10px; cursor:move; touch-action:none; min-height:38px;
  }
  .screen-head .who{font-size:.78rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .screen-actions{display:flex; gap:2px; flex-shrink:0;}
  .screen-btn{
    background:none; border:none; color:rgba(255,255,255,.85); cursor:pointer; padding:5px; border-radius:50%;
    display:flex; transition:.15s;
  }
  .screen-btn:hover{background:rgba(255,255,255,.16); color:#fff;}
  .screen-btn.danger:hover{color:#ffb4ab;}
  .screen-btn svg{width:15px; height:15px;}
  .screen-body{position:relative; width:100%; flex:1; min-height:180px; background:#000;}
  .screen-body.hide{display:none;}
  .screen-msg{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); text-align:center; padding:12px;
    background:rgba(0,0,0,.8); border-radius:var(--radius-sm); z-index:5; max-width:80%; color:#fff; font-size:.85rem;
  }
  .screen-msg.err{color:#ff9f93;}
  .screen-tab{
    display:none; padding:6px; text-align:center; font-size:.7rem; color:#fff; cursor:pointer; background:var(--header);
  }

  #bringBack{
    position:fixed; bottom:74px; left:16px; z-index:840; display:none; border:none; cursor:pointer;
    color:#fff; font-family:inherit; font-weight:700; padding:9px 16px; border-radius:99px;
    background:var(--brand); box-shadow:0 6px 16px rgba(15,102,87,.4); font-size:.85rem;
  }

  #pulseBar{
    position:fixed; bottom:74px; right:50%; transform:translateX(50%); z-index:900; display:none;
    padding:6px 15px; border-radius:99px; font-size:.72rem; background:#fff; border:1px solid var(--line);
  }
  #pulseBar.show{display:block;}
  #pulseBar.up{color:var(--online); border-color:var(--online);}
  #pulseBar.down{color:var(--danger); border-color:var(--danger);}

  #toastHost{position:fixed; bottom:120px; right:50%; transform:translateX(50%); z-index:9500; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{background:#fff; border:1px solid var(--line); color:var(--ink); padding:9px 18px; border-radius:99px; font-size:.8rem; box-shadow:0 6px 16px rgba(0,0,0,.15);}

  @media (max-width:600px){
    #screen{width:92vw; left:4vw; top:8px;}
    #bringBack{left:4vw;}
  }
</style>
</head>
<body>

<div id="gate">
  <div id="gateTop"></div>
  <div id="gateCard">
    <div class="mark">💬</div>
    <h1>صفحة نوف</h1>
    <p class="sub">دردشة لحظية بسيطة وسريعة</p>
    <div id="gateStatus"><span class="dot-pulse"></span><span id="gateStatusTxt">جاري الاتصال بالخادم...</span></div>
    <input id="nameField" type="text" placeholder="اسمك المستعار" maxlength="15" autocomplete="off" disabled>
    <button id="enterBtn" disabled>ادخل الدردشة</button>
    <div id="gateHint"></div>
  </div>
</div>

<div id="app">
  <div id="header">
    <div class="brandmark">💬</div>
    <div class="titles">
      <b>صفحة نوف</b>
      <small><span id="headerOnlineDot"></span><span id="onlineCount">0</span> متصل الآن</small>
    </div>
    <div id="headerActions">
      <button class="hdr-btn" id="bringBackTop" title="إظهار الفيديو">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4V6.5l-4 4Z"/></svg>
      </button>
      <button class="hdr-btn" id="videoPillBtn" title="تثبيت فيديو">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3.5l4 4V6.5l-4 4Z"/></svg>
      </button>
      <button class="hdr-btn" id="rosterPillBtn" title="المتصلون">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="6" r="4"/><path d="M12 14c-6 0-8 3-8 5v1h16v-1c0-2-2-5-8-5Z"/></svg>
      </button>
    </div>
  </div>

  <div id="feed"></div>
  <div id="typeline"></div>

  <form id="dock" autocomplete="off">
    <input id="textField" type="text" placeholder="اكتب رسالتك..." maxlength="500" disabled>
    <button id="shootBtn" type="submit" disabled>
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>
    </button>
  </form>

  <div id="screen"></div>
</div>

<button id="bringBack">🎬 إظهار الفيديو</button>
<div id="pulseBar"></div>
<div id="modalHost"></div>
<div id="toastHost"></div>

<script>
(function(){
"use strict";

/* ============================================================
   ICONS
============================================================ */
const ICO = {
  close:  '<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>',
  trash:  '<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/></svg>',
  shrink: '<svg viewBox="0 0 24 24"><path d="M19 13H5v-2h14v2z" fill="currentColor"/></svg>',
};

/* ============================================================
   TINY DOM / UTIL HELPERS
============================================================ */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = (s) => { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; };
const nowMs = () => Date.now();

// Consistent per-user avatar color, hashed from the username (Slack-style palette).
const AVATAR_COLORS = ['#0f6657','#7c5cff','#e05a47','#2e86c1','#b8860b','#8e44ad','#117864','#c0392b'];
function avatarColor(name){
  let h = 0;
  for (let i=0;i<name.length;i++) h = (h*31 + name.charCodeAt(i)) >>> 0;
  return AVATAR_COLORS[h % AVATAR_COLORS.length];
}
function initial(name){ return (name || '?').trim().charAt(0).toUpperCase(); }

function toast(msg){
  const host = $('#toastHost');
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300); }, 2600);
}

/* ============================================================
   FIREBASE CORE
============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDttyEjbuC6gzHxuN0IR8yi_9fO-aFyW64",
  authDomain: "studio-4914109762-6a41f.firebaseapp.com",
  databaseURL: "https://studio-4914109762-6a41f-default-rtdb.firebaseio.com",
  projectId: "studio-4914109762-6a41f",
  storageBucket: "studio-4914109762-6a41f.firebasestorage.app",
  messagingSenderId: "134781295069",
  appId: "1:134781295069:web:3c020f46f8fbeaca24fe34"
};

const Core = {
  db: null, auth: null, uid: null, timeOffset: 0,
  init(){
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    this.db = firebase.database();
    this.auth = firebase.auth();
  },
  async signIn(){
    const cred = await this.auth.signInAnonymously();
    this.uid = cred.user.uid;
    return this.uid;
  },
  watchOffset(cb){
    this.db.ref('.info/serverTimeOffset').on('value', snap => {
      this.timeOffset = snap.val() || 0;
      cb && cb(this.timeOffset);
    });
  },
  serverNow(){ return nowMs() + this.timeOffset; },
  stamp(){ return firebase.database.ServerValue.TIMESTAMP; }
};

/* ============================================================
   PRESENCE  (online users, heartbeat, cleanup, typing)
============================================================ */
const IDLE_MS = 60000, GONE_MS = 120000, TYPE_TIMEOUT = 3000, HEARTBEAT = 30000, SWEEP = 60000;

const Presence = {
  username:'', ref:null, typingRef:null,
  heartbeatTimer:null, sweepTimer:null, typingClearTimer:null, isTyping:false,
  onlineListener:null, typingUpdateListener:null,
  countCb:null, typersCb:null,

  start(username){
    this.username = username;
    this.ref = Core.db.ref(`online/${Core.uid}`);
    this.typingRef = Core.db.ref('typing');

    // ✅ Presence must be (re)written every time the connection comes up,
    // not just once at login. A brief network drop (wifi/cell handoff,
    // screen lock, backgrounded tab) makes the server fire onDisconnect()
    // immediately, wiping the online/{uid} node. The SDK reconnects on its
    // own afterwards, but nothing re-creates the full record unless we
    // listen for it here — otherwise the next heartbeat's partial update()
    // recreates the node with only "lastActive" and no "username", which
    // is exactly what shows up as "مجهول" in the roster.
    this.connectedRef = Core.db.ref('.info/connected');
    this.connectedListener = this.connectedRef.on('value', snap => {
      if (snap.val() !== true) return;
      this.ref.onDisconnect().remove();
      this.ref.set({ username: this.username, lastActive: Core.stamp(), uid: Core.uid });
      this.typingRef.child(Core.uid).onDisconnect().remove();
    });

    // Defensive redundancy: even if a reconnect is somehow missed, every
    // heartbeat also carries the full identity fields, not just lastActive,
    // so a partially-recreated node self-heals within one heartbeat cycle.
    this.heartbeatTimer = setInterval(() => {
      this.ref.update({ lastActive: Core.stamp(), username: this.username, uid: Core.uid });
    }, HEARTBEAT);

    this.sweepTimer = setInterval(() => this.sweepInactive(), SWEEP);

    this.onlineListener = Core.db.ref('online').on('value', snap => {
      this.countCb && this.countCb(snap.numChildren());
    });

    this.typingUpdateListener = this.typingRef.on('value', snap => {
      const data = snap.val() || {};
      const others = Object.keys(data).filter(k => k !== Core.uid).map(k => data[k]).filter(Boolean);
      this.typersCb && this.typersCb(others);
    });
  },

  sweepInactive(){
    const now = Core.serverNow();
    Core.db.ref('online').once('value', snap => {
      snap.forEach(child => {
        if (child.key === Core.uid) return;
        const d = child.val();
        if (now - (d.lastActive || 0) > GONE_MS) child.ref.remove();
      });
    });
  },

  markTyping(hasText){
    if (!this.typingRef) return;
    if (hasText && !this.isTyping){
      this.isTyping = true;
      this.typingRef.child(Core.uid).set(this.username);
      clearTimeout(this.typingClearTimer);
      this.typingClearTimer = setTimeout(() => this.clearTyping(), TYPE_TIMEOUT);
    } else if (!hasText){
      this.clearTyping();
    }
  },
  clearTyping(){
    if (this.isTyping && this.typingRef){
      this.typingRef.child(Core.uid).remove();
      this.isTyping = false;
    }
    clearTimeout(this.typingClearTimer);
  },

  listRoster(cb){
    const ref = Core.db.ref('online');
    const listener = ref.on('value', snap => cb(snap.val() || {}));
    return () => ref.off('value', listener);
  },

  dispose(){
    clearInterval(this.heartbeatTimer);
    clearInterval(this.sweepTimer);
    clearTimeout(this.typingClearTimer);
    if (this.connectedListener && this.connectedRef) this.connectedRef.off('value', this.connectedListener);
    if (this.onlineListener) Core.db.ref('online').off('value', this.onlineListener);
    if (this.typingUpdateListener && this.typingRef) this.typingRef.off('value', this.typingUpdateListener);
    if (this.typingRef) this.typingRef.child(Core.uid).remove();
    if (this.ref) this.ref.remove();
  }
};

/* ============================================================
   MESSAGES
============================================================ */
const Messages = {
  ref:null, query:null, addListener:null, removeListener:null,
  seen:new Set(), timeEls:new Map(), timeObserver:null, tickTimer:null,

  init(feedEl){
    this.feedEl = feedEl;
    this.timeObserver = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) this.refreshOne(e.target.dataset.mkey); });
    }, { threshold:.1 });
    this.tickTimer = setInterval(() => {
      this.timeEls.forEach((v, key) => {
        const rect = v.el.getBoundingClientRect();
        if (rect.bottom > 0 && rect.top < window.innerHeight) this.refreshOne(key);
      });
    }, 30000);
  },

  start(onAdd, onRemove){
    this.ref = Core.db.ref('messages');
    this.query = this.ref.orderByChild('timestamp').limitToLast(100);
    this.addListener = this.query.on('child_added', snap => {
      if (this.seen.has(snap.key)) return;
      this.seen.add(snap.key);
      onAdd(snap.key, snap.val());
    });
    this.removeListener = this.ref.on('child_removed', snap => {
      this.seen.delete(snap.key);
      const meta = this.timeEls.get(snap.key);
      if (meta) { this.timeObserver.unobserve(meta.el); this.timeEls.delete(snap.key); }
      onRemove(snap.key);
    });
  },

  send(username, text){
    return this.ref.push({ user: username, text, timestamp: Core.stamp(), uid: Core.uid });
  },
  remove(key){ this.ref.child(key).remove(); },

  registerTimeEl(key, timestamp, el){
    this.timeEls.set(key, { el, timestamp });
    this.timeObserver.observe(el);
    this.refreshOne(key);
  },
  refreshOne(key){
    const meta = this.timeEls.get(key);
    if (!meta) return;
    meta.el.textContent = relTime(meta.timestamp);
  },

  dispose(){
    if (this.addListener && this.query) this.query.off('child_added', this.addListener);
    if (this.removeListener) this.ref.off('child_removed', this.removeListener);
    clearInterval(this.tickTimer);
    if (this.timeObserver) this.timeObserver.disconnect();
    this.seen.clear();
    this.timeEls.clear();
  }
};

function relTime(ts){
  if (!ts) return '';
  const diff = Math.max(0, Math.floor((Core.serverNow() - ts) / 1000));
  if (diff < 60) return `${diff} ث`;
  if (diff < 3600) return `${Math.floor(diff/60)} د`;
  if (diff < 86400) return `${Math.floor(diff/3600)} س`;
  return `${Math.floor(diff/86400)} ي`;
}

/* ============================================================
   VIDEO — url parsing
============================================================ */
const VideoParse = {
  YT: /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|\S*?[?&]v=)|youtu\.be\/)([a-zA-Z0-9_-]{11})/,
  TW: /(?:twitter\.com|x\.com)\/\w+\/status\/(\d+)/,
  FILE: /\.(mp4|webm|ogv|mov)(\?.*)?$/i,
  HLS_EXT: /\.m3u8(\?.*)?$/i,

  async parse(rawUrl){
    const url = rawUrl.trim();
    let m = url.match(this.YT);
    if (m) return { type:'youtube', id:m[1] };
    m = url.match(this.TW);
    if (m) return { type:'twitter', id:m[1] };
    if (this.FILE.test(url)) return { type:'direct', src:url };
    // Trust only an explicit .m3u8 extension or an /hls/ path segment.
    // No pre-flight fetch(): CORS on live/token streams routinely blocks
    // HEAD/GET checks against otherwise perfectly valid streams. hls.js
    // itself will surface a real error if playback genuinely fails.
    if (this.HLS_EXT.test(url) || /\/hls\//i.test(url)) return { type:'hls', src:url };
    return null;
  }
};

/* ============================================================
   VIDEO — player widget
============================================================ */
class VideoWidget {
  constructor(container, data, myUid, actions){
    this.el = container;
    this.data = data;
    this.myUid = myUid;
    this.actions = actions;
    this.videoEl = null;
    this.hls = null;
    this.minimized = false;
    this._render();
    this._load();
  }

  _render(){
    const isOwner = this.data.uid === this.myUid;
    this.el.innerHTML = `
      <div class="screen-head">
        <span class="who">🎬 ${esc(this.data.setBy || '')}</span>
        <div class="screen-actions">
          <button class="screen-btn" data-act="min" title="تصغير">${ICO.shrink}</button>
          ${isOwner ? `<button class="screen-btn danger" data-act="close" title="حذف للجميع">${ICO.close}</button>` : ''}
        </div>
      </div>
      <div class="screen-body" id="scrBody"><div class="screen-msg">⏳ جاري التحميل...</div></div>
      <div class="screen-tab" id="scrTab">⬆ اضغط للتكبير</div>
    `;
    this.el.querySelector('[data-act="min"]').onclick = () => { this._toggleMin(true); this.actions.onMinimize(); };
    const closeBtn = this.el.querySelector('[data-act="close"]');
    if (closeBtn) closeBtn.onclick = () => this.actions.onClose();
    this.el.querySelector('#scrTab').onclick = () => { this._toggleMin(false); this.actions.onRestore(); };
    this._makeDraggable();
  }

  _toggleMin(min){
    this.minimized = min;
    const body = this.el.querySelector('#scrBody');
    const tab = this.el.querySelector('#scrTab');
    body.classList.toggle('hide', min);
    tab.style.display = min ? 'block' : 'none';
    this.el.classList.toggle('small', min);
  }
  restoreFromExternal(){ this._toggleMin(false); }

  async _load(){
    const body = this.el.querySelector('#scrBody');
    if (!body) return;
    try{
      if (this.data.type === 'youtube') return this._youtube(body);
      if (this.data.type === 'twitter') return this._twitter(body);
      return await this._directOrHls(body);
    } catch(e){
      console.error('video load error', e);
      this._err(body, 'تعذر تحميل المشغل');
    }
  }

  _youtube(body){
    body.innerHTML = `<iframe src="https://www.youtube.com/embed/${this.data.id}?autoplay=1&mute=1&controls=1&playsinline=1&enablejsapi=1"
      allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen
      style="position:absolute;inset:0;width:100%;height:100%;border:0;"></iframe>`;
  }
  _twitter(body){
    body.innerHTML = `<iframe src="https://twitframe.com/show?url=https://twitter.com/i/status/${this.data.id}"
      style="position:absolute;inset:0;width:100%;height:100%;border:0;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
  }

  async _directOrHls(body){
    body.innerHTML = '';
    const v = document.createElement('video');
    v.setAttribute('playsinline','');
    v.setAttribute('crossorigin','anonymous');
    v.controls = true;
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#000;';
    body.appendChild(v);
    this.videoEl = v;

    const looksLikeHls = this.data.type === 'hls' || /\.m3u8(\?.*)?$/i.test(this.data.src);
    if (looksLikeHls){ this._hls(v, this.data.src, body); return; }

    v.src = this.data.src;
    try { await v.play(); this._hideMsg(); }
    catch { this._err(body, 'لا يمكن تشغيل هذا الفيديو، تأكد من الرابط.'); }
  }

  _hls(video, url, body){
    if (window.Hls && Hls.isSupported()){
      const hls = new Hls({ enableWorker:true, lowLatencyMode:false });
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (_e, data) => {
        if (data && data.details && data.details.live) hls.config.lowLatencyMode = true;
        this._hideMsg();
        video.play().catch(()=>{});
      });
      hls.on(Hls.Events.ERROR, (_e, data) => {
        if (!data.fatal) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR){
          this._err(body, 'تعذر الاتصال بالبث، تأكد من الرابط.');
        } else if (data.type === Hls.ErrorTypes.MEDIA_ERROR){
          try { hls.recoverMediaError(); } catch { this._err(body, 'فشل استرداد البث'); }
        } else {
          this._err(body, 'فشل تشغيل البث');
          hls.destroy();
        }
      });
      this.hls = hls;
    } else if (video.canPlayType('application/vnd.apple.mpegurl')){
      video.src = url;
      video.play().catch(()=>{});
      this._hideMsg();
    } else {
      this._err(body, 'المتصفح لا يدعم هذا النوع من البث');
    }
  }

  _hideMsg(){ const m = this.el.querySelector('.screen-msg'); if (m) m.style.display='none'; }
  _err(body, msg){ body.innerHTML = `<div class="screen-msg err">⚠️<br>${esc(msg)}</div>`; }

  _makeDraggable(){
    const head = this.el.querySelector('.screen-head');
    if (!head) return;
    let dragging=false, sx=0, sy=0, ox=0, oy=0;
    const start = (e) => {
      if (e.target.closest('button')) return;
      dragging = true;
      const p = e.touches ? e.touches[0] : e;
      sx = p.clientX; sy = p.clientY;
      const r = this.el.getBoundingClientRect();
      ox = r.left; oy = r.top;
      document.addEventListener('mousemove', move);
      document.addEventListener('touchmove', move, { passive:false });
      document.addEventListener('mouseup', end);
      document.addEventListener('touchend', end);
      e.preventDefault();
    };
    const move = (e) => {
      if (!dragging) return;
      e.preventDefault();
      const p = e.touches ? e.touches[0] : e;
      let nx = ox + (p.clientX - sx), ny = oy + (p.clientY - sy);
      nx = Math.min(Math.max(nx, 8), window.innerWidth - this.el.offsetWidth - 8);
      ny = Math.min(Math.max(ny, 8), window.innerHeight - this.el.offsetHeight - 8);
      this.el.style.left = nx+'px'; this.el.style.top = ny+'px'; this.el.style.right='auto';
    };
    const end = () => {
      dragging = false;
      document.removeEventListener('mousemove', move);
      document.removeEventListener('touchmove', move);
      document.removeEventListener('mouseup', end);
      document.removeEventListener('touchend', end);
    };
    head.addEventListener('mousedown', start);
    head.addEventListener('touchstart', start, { passive:false });
  }

  dispose(){
    if (this.hls){ try{ this.hls.destroy(); }catch{} this.hls=null; }
    if (this.videoEl){ try{ this.videoEl.pause(); this.videoEl.src=''; this.videoEl.load(); }catch{} this.videoEl=null; }
    this.el.innerHTML = '';
  }
}

   VIDEO — controller
============================================================ */
const VideoBoard = {
  ref:null, listener:null, widget:null, minimized:false,

  start(containerEl, restoreBtnEls, myUid){
    this.container = containerEl;
    this.restoreBtnEls = restoreBtnEls;
    this.myUid = myUid;
    this.ref = Core.db.ref('pinned_video');
    this.listener = this.ref.on('value', snap => this._render(snap.val()));
  },
  set(data){ this.ref.set(data); },
  clear(){ this.ref.remove(); },

  _render(data){
    if (this.widget) { this.widget.dispose(); this.widget = null; }
    this.container.innerHTML = '';
    this.minimized = false;
    this.container.classList.remove('small');

    if (!data){
      this.container.style.display = 'none';
      this._showRestoreBtns(false);
      return;
    }
    this.container.style.display = 'flex';
    this._showRestoreBtns(false);

    this.widget = new VideoWidget(this.container, data, this.myUid, {
      onClose: () => {
        if (data.uid !== this.myUid) return;
        confirmModal('حذف الفيديو للجميع؟', () => { this.clear(); systemNote('🗑️ تم إزالة الفيديو'); });
      },
      onMinimize: () => { this.minimized = true; this._showRestoreBtns(true); systemNote('📹 تم تصغير الفيديو'); },
      onRestore: () => { this.minimized = false; this._showRestoreBtns(false); }
    });
  },

  restoreFromButton(){
    this.minimized = false;
    this._showRestoreBtns(false);
    if (this.widget) this.widget.restoreFromExternal();
  },
  _showRestoreBtns(show){
    this.restoreBtnEls.forEach(el => el.style.display = show ? 'flex' : 'none');
  },
  dispose(){
    if (this.listener) this.ref.off('value', this.listener);
    if (this.widget) this.widget.dispose();
  }
};

/* ============================================================
   MODALS / TOASTS
============================================================ */
function openModal(titleHtml, bodyHtml){
  const host = $('#modalHost');
  const veil = document.createElement('div');
  veil.className = 'veil';
  const sheet = document.createElement('div');
  sheet.className = 'sheet';
  sheet.innerHTML = `<h3>${titleHtml}</h3>${bodyHtml}`;
  veil.appendChild(sheet);
  host.appendChild(veil);

  const onKey = (e) => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  veil.addEventListener('click', (e) => { if (e.target === veil) close(); });

  let cleanupFns = [];
  function close(){
    document.removeEventListener('keydown', onKey);
    cleanupFns.forEach(fn => { try{ fn(); }catch{} });
    veil.remove();
  }
  const firstFocusable = sheet.querySelector('input, button');
  if (firstFocusable) setTimeout(() => firstFocusable.focus(), 80);

  return { sheet, close, onClose(fn){ cleanupFns.push(fn); } };
}

function confirmModal(message, onYes){
  const m = openModal('تأكيد', `
    <p style="text-align:center;margin-bottom:16px;font-size:.92rem;">${esc(message)}</p>
    <div class="row2">
      <button class="btn-full danger" id="mYes" style="flex:1">نعم</button>
      <button class="btn-full ghost" id="mNo" style="flex:1">إلغاء</button>
    </div>
  `);
  $('#mYes', m.sheet).onclick = () => { m.close(); onYes(); };
  $('#mNo', m.sheet).onclick = () => m.close();
}

function rosterModal(){
  const m = openModal('المتصلون الآن', `<div id="rosterList"><p class="roster-empty">جاري التحميل...</p></div>`);
  const listEl = $('#rosterList', m.sheet);
  const unsubscribe = Presence.listRoster(users => {
    const now = Core.serverNow();
    const rows = Object.values(users).sort((a,b)=>(b.lastActive||0)-(a.lastActive||0));
    if (!rows.length){ listEl.innerHTML = '<p class="roster-empty">لا يوجد متصلون</p>'; return; }
    listEl.innerHTML = rows.map(u => {
      const diff = now - (u.lastActive || 0);
      let cls='up', label='متصل';
      if (diff > GONE_MS){ cls='down'; label='غير متصل'; }
      else if (diff > IDLE_MS){ cls='idle'; label='خامل'; }
      return `<div class="roster-row"><span class="beacon ${cls}"></span><span>${esc(u.username||'مجهول')}</span><span class="roster-status">${label}</span></div>`;
    }).join('');
  });
  m.onClose(unsubscribe);
}

function videoModal(onSubmit){
  const m = openModal('تثبيت فيديو', `
    <input id="vUrl" type="text" placeholder="أدخل رابط الفيديو">
    <small>YouTube · Twitter/X · HLS (.m3u8) · MP4 مباشر</small>
    <button class="btn-full" id="vGo">تثبيت الفيديو</button>

  const btn = $('#vGo', m.sheet), input = $('#vUrl', m.sheet);

    const url = input.value.trim();
    if (!url){ toast('أدخل رابطاً'); return; }
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> جارٍ التحقق...';
    const ok = await onSubmit(url);
    if (ok){ m.close(); }
    else {
      btn.disabled = false;
      btn.innerHTML = 'تثبيت الفيديو';
      toast('الرابط غير مدعوم. جرب YouTube، Twitter، HLS أو MP4 مباشر');
    }
  };
  btn.onclick = trigger;
  input.onkeypress = (e) => { if (e.key === 'Enter') trigger(); };
}

function systemNote(text){

/* ============================================================
   FEED RENDERING
============================================================ */
const Feed = {
  el:null, atBottom:true, lastAuthor:null,
  init(el){
    this.el = el;
    el.addEventListener('scroll', () => {
      this.atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 60;
    });
  },
  scrollToBottom(){ requestAnimationFrame(() => { this.el.scrollTop = this.el.scrollHeight; }); },
  maybeScroll(){ if (this.atBottom) this.scrollToBottom(); },

  addBubble(key, data, myUid){
    const user = data.user || 'مجهول';
    const text = esc(data.text || '');
    const ts = data.timestamp || null;
    const mine = data.uid === myUid;

    const row = document.createElement('div');
    row.className = 'row ' + (mine ? 'mine' : 'theirs');
    row.id = `b-${key}`;

    const avatar = mine ? '' : `<div class="avatar" style="background:${avatarColor(user)}">${esc(initial(user))}</div>`;
    const nameLabel = mine ? '' : `<div class="who">${esc(user)}</div>`;
    const delBtn = mine ? `<button class="bub-del" aria-label="حذف الرسالة">${ICO.trash}</button>` : '';

    row.innerHTML = `
      ${avatar}
      <div class="stack">
        ${nameLabel}
        <div class="bub">
          ${text}
          <div class="bub-meta">${delBtn}<span class="bub-time"></span></div>
        </div>
      </div>
    `;

    const timeEl = row.querySelector('.bub-time');
    if (ts){ Messages.registerTimeEl(key, ts, timeEl); timeEl.dataset.mkey = key; }
    if (mine){
      row.querySelector('.bub-del').onclick = () => confirmModal('حذف الرسالة؟', () => Messages.remove(key));
    }

    this.el.appendChild(row);
    this.maybeScroll();
  },

  removeBubble(key){
    const el = document.getElementById(`b-${key}`);
    if (!el) return;
    el.style.transition = 'opacity .25s, transform .25s';
    el.style.opacity = '0';
    el.style.transform = 'scale(.94)';
    setTimeout(() => el.remove(), 250);
  }
};

/* ============================================================
   APP BOOTSTRAP
============================================================ */
const App = {
  username:'', loggedIn:false,

  async boot(){
    Core.init();
    Feed.init($('#feed'));
    Messages.init($('#feed'));
    this._bindGate();
    try{
      $('#gateStatusTxt').textContent = 'جاري المصادقة...';
      await Core.signIn();
      $('#gateStatusTxt').textContent = 'تم! أدخل اسمك للمتابعة';
      $('#nameField').disabled = false;
      $('#enterBtn').disabled = false;
      $('#nameField').focus();
    } catch(err){
      console.error(err);
      $('#gateStatusTxt').textContent = 'فشلت المصادقة: ' + (err.message || '');
      $('#gateStatusTxt').style.color = 'var(--danger)';
    }
  },

  _bindGate(){
    $('#enterBtn').onclick = () => this._tryEnter();
    $('#nameField').onkeypress = (e) => { if (e.key === 'Enter') this._tryEnter(); };
  },

  _tryEnter(){
    if (this.loggedIn || $('#enterBtn').disabled) return;
    const name = $('#nameField').value.trim();
    const hint = $('#gateHint');
    if (/[.#$\[\]\/]/.test(name)){ hint.textContent = 'لا تستخدم الرموز: . # $ [ ] /'; return; }
    if (name.length < 2){ hint.textContent = 'الاسم قصير جداً'; return; }
    if (name.length > 15){ hint.textContent = 'الاسم طويل جداً'; return; }
    hint.textContent = '';
    this.username = name;
    this._enter();
  },

  _enter(){
    this.loggedIn = true;
    $('#gate').style.display = 'none';
    $('#app').classList.add('on');
    $('#textField').disabled = false;
    $('#shootBtn').disabled = false;

    Core.watchOffset();

    Presence.countCb = (n) => { $('#onlineCount').textContent = n; };
    Presence.start(this.username);

    Messages.start(
      (key, data) => Feed.addBubble(key, data, Core.uid),
      (key) => Feed.removeBubble(key)
    );

    VideoBoard.start($('#screen'), [$('#bringBack'), $('#bringBackTop')], Core.uid);

    Connection.watch(() => this.loggedIn);

    this._bindDock();
    this._bindTopBar();

    systemNote(`مرحباً ${this.username} 👋`);
  },

  _bindDock(){
    $('#dock').addEventListener('submit', (e) => {
      e.preventDefault();
      const input = $('#textField');
      const text = input.value.trim();
      if (!text) return;
      if (text.length > 500){ systemNote('الرسالة طويلة جداً (الحد 500 حرف)'); return; }
      const btn = $('#shootBtn');
      btn.disabled = true;
      setTimeout(() => btn.disabled = false, 800);
      Messages.send(this.username, text).catch(err => {
        console.error(err);
        systemNote('فشل إرسال الرسالة');
        btn.disabled = false;
      });
      input.value = '';
      Presence.markTyping(false);
    });

    const tline = $('#typeline');
    $('#textField').addEventListener('input', (e) => Presence.markTyping(e.target.value.trim().length > 0));
    $('#textField').addEventListener('blur', () => Presence.markTyping(false));

    Presence.typersCb = (names) => {
      if (!names.length){ tline.classList.remove('on'); tline.innerHTML=''; return; }
      let phrase;
      if (names.length === 1) phrase = `${esc(names[0])} يكتب`;
      else if (names.length === 2) phrase = `${esc(names[0])} و${esc(names[1])} يكتبان`;
      else phrase = `${names.length} أشخاص يكتبون`;
      tline.innerHTML = `${phrase}<span class="tdots"><i></i><i></i><i></i></span>`;
      tline.classList.add('on');
    };
  },

  _bindTopBar(){
    $('#rosterPillBtn').onclick = () => rosterModal();
    $('#videoPillBtn').onclick = () => videoModal(async (url) => {
      const parsed = await VideoParse.parse(url);
      if (!parsed) return false;
      parsed.setBy = this.username;
      parsed.uid = Core.uid;
      VideoBoard.set(parsed);
      systemNote(`${this.username} ثبت فيديو 🎬`);
      return true;
    });
    $('#bringBack').onclick = () => VideoBoard.restoreFromButton();
    $('#bringBackTop').onclick = () => VideoBoard.restoreFromButton();
  },

  dispose(){
    this.loggedIn = false;
    Presence.dispose();
    Messages.dispose();
    VideoBoard.dispose();
  }
};

document.addEventListener('DOMContentLoaded', () => App.boot());
window.addEventListener('beforeunload', () => App.dispose());

})();
</script>
</body>
</html>
