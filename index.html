VideoWidget.prototype._directOrHls=async function(b){b.innerHTML='';var v=document.createElement('video');v.setAttribute('playsinline','');v.setAttribute('crossorigin','anonymous');v.controls=true;v.style.cssText='position:absolute;inset:0;width:100%;height:100%;background:#000';b.appendChild(v);this.videoEl=v;var isHls=this.data.type==='hls'||/\.m3u8(\?.*)?$/i.test(this.data.src);if(isHls){this._hls(v,this.data.src,b);return}v.src=this.data.src;try{await v.play();this._hideMsg()}catch(e){this._err(b,'لا يمكن تشغيل هذا الفيديو')}};

VideoWidget.prototype._makeDraggable=function(){var self=this;var h=this.el.querySelector('.vp-head');if(!h)return;var dragging=false,sx=0,sy=0,ox=0,oy=0;var start=function(e){if(e.target.closest('button'))return;dragging=true;var p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;var r=self.el.getBoundingClientRect();ox=r.left;oy=r.top;document.addEventListener('mousemove',move);document.addEventListener('touchmove',move,{passive:false});document.addEventListener('mouseup',end);document.addEventListener('touchend',end);e.preventDefault()};var move=function(e){if(!dragging)return;e.preventDefault();var p=e.touches?e.touches[0]:e;var nx=ox+(p.clientX-sx),ny=oy+(p.clientY-sy);nx=Math.min(Math.max(nx,8),window.innerWidth-self.el.offsetWidth-8);ny=Math.min(Math.max(ny,8),window.innerHeight-self.el.offsetHeight-8);self.el.style.left=nx+'px';self.el.style.top=ny+'px';self.el.style.right='auto'};var end=function(){dragging=false;document.removeEventListener('mousemove',move);document.removeEventListener('touchmove',move);document.removeEventListener('mouseup',end);document.removeEventListener('touchend',end)};h.addEventListener('mousedown',start);h.addEventListener('touchstart',start,{passive:false})};

var VideoBoard={ref:null,listener:null,widget:null,minimized:false,container:null,restoreBtnEls:null,myUid:null,start:function(c,r,uid){this.container=c;this.restoreBtnEls=r;this.myUid=uid;this.ref=Core.db.ref('pinned_video');var self=this;this.listener=this.ref.on('value',function(s){self._render(s.val())})},set:function(d){this.ref.set(d)},clear:function(){this.ref.remove()},_render:function(d){if(this.widget){this.widget.dispose();this.widget=null}this.container.innerHTML='';this.minimized=false;this.container.classList.remove('mini');if(!d){this.container.style.display='none';this._showRestoreBtns(false);return}this.container.style.display='flex';this._showRestoreBtns(false);var self=this;this.widget=new VideoWidget(this.container,d,this.myUid,{onClose:function(){if(d.uid!==self.myUid)return;confirmModal('حذف الفيديو للجميع؟',function(){self.clear();systemNote('🗑️ تم إزالة الفيديو')})},onMinimize:function(){self.minimized=true;self._showRestoreBtns(true);systemNote('📹 تم تصغير الفيديو')},onRestore:function(){self.minimized=false;self._showRestoreBtns(false)}})},restoreFromButton:function(){this.minimized=false;this._showRestoreBtns(false);if(this.widget)this.widget.restoreFromExternal()},_showRestoreBtns:function(s){this.restoreBtnEls.forEach(function(el){el.style.display=s?'flex':'none'})},dispose:function(){if(this.listener)this.ref.off('value',this.listener);if(this.widget)this.widget.dispose()}};

var Feed={el:null,atBottom:true,init:function(el){this.el=el;if(!el)return;var self=this;el.addEventListener('scroll',function(){self.atBottom=(el.scrollHeight-el.scrollTop-el.clientHeight)<60})},scrollToBottom:function(){var self=this;if(this.el)requestAnimationFrame(function(){self.el.scrollTop=self.el.scrollHeight})},maybeScroll:function(){if(this.atBottom)this.scrollToBottom()},addBubble:function(k,d,uid){if(!this.el)return;var u=esc(d.user||'مجهول');var t=esc(d.text||'');var ts=d.timestamp||null;var div=document.createElement('div');div.className='msg';div.id='b-'+k;div.innerHTML='<span class="msg-tag">'+u+'</span><span class="msg-body">'+t+'</span><span class="msg-time"></span>';var tel=div.querySelector('.msg-time');if(ts){Messages.registerTimeEl(k,ts,tel);tel.dataset.mkey=k}if(d.uid===uid){var del=document.createElement('button');del.className='msg-del';del.innerHTML=ICO.trash;del.setAttribute('aria-label','حذف');del.onclick=function(){confirmModal('حذف الرسالة؟',function(){Messages.remove(k)})};div.appendChild(del)}this.el.appendChild(div);this.maybeScroll()},removeBubble:function(k){var el=document.getElementById('b-'+k);if(!el)return;el.style.transition='opacity .25s,transform .25s';el.style.opacity='0';el.style.transform='scale(.92)';setTimeout(function(){el.remove()},250)}};

var App={username:'',loggedIn:false,boot:async function(){try{Core.init();Feed.init($('#feed'));Messages.init($('#feed'));this._bindGate();$('#gateStatusTxt').textContent='جاري المصادقة...';await Core.signIn();$('#gateStatusTxt').textContent='تم! أدخل اسمك للمتابعة';$('#gate .pulse').style.background='var(--gn)';$('#nameField').disabled=false;$('#enterBtn').disabled=false;$('#nameField').focus()}catch(e){console.error(e);$('#gateStatusTxt').textContent='فشلت المصادقة: '+(e.message||'خطأ');$('#gateStatusTxt').style.color='var(--rd)'}},_bindGate:function(){var self=this;var eb=$('#enterBtn');var nf=$('#nameField');if(eb)eb.onclick=function(){self._tryEnter()};if(nf)nf.onkeypress=function(e){if(e.key==='Enter')self._tryEnter()}},_tryEnter:function(){if(this.loggedIn||$('#enterBtn').disabled)return;var n=$('#nameField').value.trim();var h=$('#gateHint');if(!h)return;if(/[.#$\[\]\/]/.test(n)){h.textContent='⚠️ لا تستخدم الرموز: . # $ [ ] /';return}if(n.length<2){h.textContent='⚠️ الاسم قصير جداً';return}if(n.length>15){h.textContent='⚠️ الاسم طويل جداً';return}h.textContent='';this.username=n;this._enter()},_enter:function(){this.loggedIn=true;$('#gate').style.display='none';$('#app').classList.add('on');$('#textField').disabled=false;$('#shootBtn').disabled=false;Core.watchOffset();var self=this;Presence.countCb=function(n){var c=$('#onlineCount');if(c)c.textContent=n};Presence.start(this.username);Messages.start(function(k,d){Feed.addBubble(k,d,Core.uid)},function(k){Feed.removeBubble(k)});VideoBoard.start($('#screen'),[$('#bringBack'),$('#bringBackTop')],Core.uid);Connection.watch(function(){return self.loggedIn});this._bindDock();this._bindTopBar();systemNote('👋 مرحباً '+this.username+'!')},_bindDock:function(){var self=this;var d=$('#dock');if(!d)return;d.addEventListener('submit',function(e){e.preventDefault();var i=$('#textField');if(!i)return;var t=i.value.trim();if(!t)return;if(t.length>500){systemNote('⚠️ الرسالة طويلة جداً');return}var b=$('#shootBtn');if(b){b
